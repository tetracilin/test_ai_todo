name: ${COMPOSE_PROJECT_NAME:-t3-paperclip}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperclip}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - database

  paperclip:
    image: ${PAPERCLIP_IMAGE:-ghcr.io/paperclipai/paperclip:sha-6a4e2e1@sha256:66056e8c979bc2f8ef35083ebd333b7c83224fe3234bd92d251b0bbce1054317}
    entrypoint: ["/usr/local/bin/t3-container-entrypoint"]
    command: ["node", "--import", "./server/node_modules/tsx/dist/loader.mjs", "server/dist/index.js"]
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_CONFIG: /etc/paperclip/config.json
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_BIND: lan
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://127.0.0.1:33100}
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES:-localhost,127.0.0.1}
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      PAPERCLIP_MIGRATION_PROMPT: never
      PAPERCLIP_SECRETS_STRICT_MODE: "true"
      # Where the entrypoint materializes storage secrets that the
      # unprivileged app user must read. Docker mounts /run/secrets root-owned,
      # so the artifact keys are copied here and chowned before privileges drop.
      PAPERCLIP_SECRETS_DIR: /run/paperclip-storage-secrets
      PAPERCLIP_TELEMETRY_DISABLED: "1"
      # Comma-separated adapter types an operator may pick when hiring an
      # agent (server/src/adapters/registry.ts:listSelectableServerAdapters).
      # Unset here falls back to hermes_gateway,claude_local, so an instance
      # that wants a narrower or different set must set this explicitly.
      PAPERCLIP_SELECTABLE_ADAPTER_TYPES: ${PAPERCLIP_SELECTABLE_ADAPTER_TYPES:-hermes_gateway,claude_local}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-paperclip}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      HERMES_API_BASE_URL: ${HERMES_API_BASE_URL:-http://host.docker.internal:8642}
    secrets:
      - postgres_password
      - better_auth_secret
      - paperclip_artifacts_access_key
      - paperclip_artifacts_secret_key
    volumes:
      - paperclip-data:/paperclip
      - ./paperclip-config.json:/etc/paperclip/config.json:ro
      - ./scripts/container-entrypoint.sh:/usr/local/bin/t3-container-entrypoint:ro
    ports:
      - "${PAPERCLIP_BIND_ADDRESS:-127.0.0.1}:${PAPERCLIP_PORT:-33100}:3100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3100/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    networks:
      - database
      - gateway

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  better_auth_secret:
    file: ${BETTER_AUTH_SECRET_FILE:-./secrets/better_auth_secret}
  # Artifact storage (MinIO/S3) credentials. Production has always mounted
  # these; they were missing here, so a deploy through this compose file would
  # have dropped them. Each environment supplies its own values — staging must
  # never carry production bucket credentials.
  paperclip_artifacts_access_key:
    file: ${PAPERCLIP_ARTIFACTS_ACCESS_KEY_FILE:-./secrets/paperclip_artifacts_access_key}
  paperclip_artifacts_secret_key:
    file: ${PAPERCLIP_ARTIFACTS_SECRET_KEY_FILE:-./secrets/paperclip_artifacts_secret_key}

volumes:
  postgres-data:
  paperclip-data:

networks:
  database:
    internal: true
  gateway:
    driver: bridge
