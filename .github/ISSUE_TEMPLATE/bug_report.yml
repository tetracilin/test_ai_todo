name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Staging (nightly)
        - Production
        - Not sure
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What did you do? Numbered steps
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: What did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to see?
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: How bad is it?
      options:
        - Blocks my work
        - Annoying
        - Cosmetic
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or anything else (remove passwords and personal data first)
    validations:
      required: false
