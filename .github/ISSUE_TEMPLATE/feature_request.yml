name: Feature request
description: Ask for something new or a change to how something works
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want solved? Who has it?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How will you know it works? Describe what you would click and see
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: How big do you think it is?
      options:
        - Small - one screen or one rule
        - Medium - a few screens
        - Large - a new area
        - Not sure
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
    validations:
      required: false
