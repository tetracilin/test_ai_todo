name: K15 CI/CD

# Ordered CI/CD pipeline for the canonical Paperclip fork (§K15).
# Workflow steps mirror scripts/ci/k15-run.mjs exactly and are gated
# sequentially so a downstream stage never runs before its upstream
# gates pass.  Image publish and git tag fire only when EVERY gate is
# green.

on:
  push:
    branches:
      - "t3-paperclip-aitodo/t_b1377057*"  # development workspace
  workflow_dispatch:
    inputs:
      red_gate:
        description: "Gate to deliberately fail (rehearsal)"
        required: false
        type: string

concurrency:
  group: k15-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "9.15.4"
  NODE_VERSION: "24"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: K15 ordered CI gates
        id: k15
        run: |
          RED_GATE="${{ inputs.red_gate }}"
          if [ -n "$RED_GATE" ]; then
            node scripts/ci/k15-run.mjs --red-gate "$RED_GATE"
          else
            node scripts/ci/k15-run.mjs
          fi
        env:
          K15_CI_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Image publish pre-conditions (registry tag deferred to release lane).

      - name: Set image digest output
        if: success()
        id: digest
        run: |
          DIGEST=$(jq -r '.components["@paperclipai/server"].imageDigest // .imageDigest // empty' report/k15-ci/publish-*.json 2>/dev/null || echo "")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: k15-ci-report
          path: report/k15-ci/