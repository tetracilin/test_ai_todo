name: K15 CI/CD
on:
  push:
    branches: ["t3-paperclip-aitodo/t_b1377057*"]
  workflow_dispatch:
    inputs:
      red_gate:
        description: "Gate to deliberately fail (rehearsal)"
        required: false
        type: string
concurrency:
  group: k15-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PNPM_VERSION: "9.15.4"
  NODE_VERSION: "24"
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: K15 ordered CI gates
        id: k15
        run: |
          RED_GATE="${{ inputs.red_gate }}"
          if [ -n "$RED_GATE" ]; then
            node scripts/ci/k15-run.mjs --red-gate "$RED_GATE"
          else
            node scripts/ci/k15-run.mjs
          fi
        env:
          K15_CI_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: k15-ci-report
          path: report/k15-ci/