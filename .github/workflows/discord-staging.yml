# Discord bridge — build, test, deploy to staging
#
# Manual, protected staging deployment of the discord-bridge service defined in
# deploy-staging/compose.yaml. Two jobs:
#
#   1. build — install bridge deps, run the vitest suite, typecheck/build, and
#      validate the Compose file with dummy gitignored secret files.
#   2. deploy-staging — needs: build; SSHes to the staging host, writes the
#      Discord credential files (from GitHub Environment secrets, never repo
#      variables), checks out the exact deployed SHA, and runs
#      `docker compose up -d --build` so the host builds the bridge image from
#      that pinned commit (the K16 staging pattern; the fork does not publish
#      registry images yet). Verifies with deploy-staging/scripts/healthcheck.sh
#      and optionally registers slash commands.
#
# Secrets: every credential referenced here comes from the protected
# `discord-staging` GitHub Environment. Values are streamed to the host over
# ssh stdin and are never echoed, never passed as CLI arguments, and never
# written to repository files. GitHub masks ${{ secrets.* }} in logs.
#
# Service/env-name contract with deploy-staging/compose.yaml:
#   - compose service name:      discord-bridge
#   - bridge image override:     PAPERCLIP_DISCORD_BRIDGE_IMAGE (default keeps
#                                the compose default; host builds from source)
#   - secret files (gitignored): deploy-staging/secrets/{discord_bot_token,
#                                discord_client_id, discord_webhook_secret,
#                                paperclip_discord_bridge_token,
#                                discord_dev_guild_id (optional)}

name: Discord staging deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build and deploy to staging
        required: true
        default: main
        type: string
      register_commands:
        description: Register slash commands after the bridge becomes healthy
        required: true
        default: true
        type: boolean

concurrency:
  group: discord-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test Discord bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve immutable deploy commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install bridge dependencies
        working-directory: discord-bridge
        run: npm ci

      - name: Run bridge tests
        working-directory: discord-bridge
        run: npm test

      - name: Typecheck and build bridge
        working-directory: discord-bridge
        run: npm run build

      # Compose validates the secret *files* exist (they are gitignored), so
      # stage throwaway files with the exact names the compose file expects.
      # This catches compose/secret-name drift in CI before any deploy.
      - name: Validate staging Compose file
        run: |
          set -euo pipefail
          mkdir -p deploy-staging/secrets
          for file in \
            postgres_password better_auth_secret \
            paperclip_artifacts_access_key paperclip_artifacts_secret_key \
            paperclip_discord_bridge_token discord_bot_token \
            discord_client_id discord_webhook_secret discord_dev_guild_id; do
            printf 'validation-only\n' > "deploy-staging/secrets/$file"
          done
          git check-ignore -q deploy-staging/secrets/discord_bot_token
          docker compose -f deploy-staging/compose.yaml config --quiet

      - name: Build bridge image
        run: docker build --tag paperclip-discord-bridge:ci-${{ steps.source.outputs.sha }} discord-bridge

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: discord-staging
    steps:
      - name: Set up SSH to staging host
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Create staging secret directory
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "umask 077; mkdir -p '$STAGING_DEPLOY_PATH/deploy-staging/secrets'"

      # Required credential files. Values are streamed over ssh stdin so they
      # never appear in argv, logs, or the repository. Optional
      # DISCORD_DEV_GUILD_ID is written only when the Environment secret exists.
      - name: Install Discord credentials on staging host
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          PAPERCLIP_DISCORD_BRIDGE_TOKEN: ${{ secrets.PAPERCLIP_DISCORD_BRIDGE_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_WEBHOOK_SECRET: ${{ secrets.DISCORD_WEBHOOK_SECRET }}
          DISCORD_DEV_GUILD_ID: ${{ secrets.DISCORD_DEV_GUILD_ID }}
        run: |
          set -euo pipefail
          write_secret() {
            name="$1"
            value="$2"
            test -n "$value"
            printf '%s' "$value" | ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
              "umask 077; cat > '$STAGING_DEPLOY_PATH/deploy-staging/secrets/$name'; chmod 600 '$STAGING_DEPLOY_PATH/deploy-staging/secrets/$name'"
          }
          write_secret paperclip_discord_bridge_token "$PAPERCLIP_DISCORD_BRIDGE_TOKEN"
          write_secret discord_bot_token "$DISCORD_BOT_TOKEN"
          write_secret discord_client_id "$DISCORD_CLIENT_ID"
          write_secret discord_webhook_secret "$DISCORD_WEBHOOK_SECRET"
          if [ -n "$DISCORD_DEV_GUILD_ID" ]; then
            write_secret discord_dev_guild_id "$DISCORD_DEV_GUILD_ID"
          fi

      # Deploy the exact SHA the build job tested. The host builds the bridge
      # image from that pinned checkout (K16 pattern; no registry image yet),
      # waits for Compose health, then verifies every probe in healthcheck.sh.
      - name: Deploy staging Compose project
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ needs.build.outputs.sha }}
          REGISTER_COMMANDS: ${{ inputs.register_commands }}
        run: |
          set -euo pipefail
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "set -euo pipefail
             cd '$STAGING_DEPLOY_PATH'
             git fetch origin
             git checkout --detach '$DEPLOY_SHA'
             cd deploy-staging
             docker compose -f compose.yaml up -d --build
             ./scripts/healthcheck.sh
             if [ '$REGISTER_COMMANDS' = 'true' ]; then
               docker compose -f compose.yaml run --rm discord-bridge node dist/registerCommands.js
             fi
             ./scripts/healthcheck.sh"
