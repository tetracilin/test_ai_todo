# CI — gate for PRs into develop and main.
# Runs on GitHub-hosted runners (never on kmv8): PR code is untrusted until merged.
# Required status check for branch protection: "ci / build-image".
#
# Scope note: the heavy test gauntlet (policy/verify/e2e, sharded suites) lives in
# pr.yml and runs on PRs into main. This workflow is deliberately narrow — the image
# build is the gate that matters for deployment: if the Dockerfile doesn't build,
# nightly and release cannot deploy. Duplicating the full vitest suite here made the
# job take 11+ minutes and get cancelled by the concurrency guard.

name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
            PAPERCLIP_BUILD_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
