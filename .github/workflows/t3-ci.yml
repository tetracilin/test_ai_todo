# t3-ci — merge gate. Runs on every PR into develop or main, and on pushes to them.
# GitHub-hosted runners only (never kmv8): PR code is untrusted until merged.
#
# Required status checks for branch protection — use these EXACT names:
#   "unit", "build", "build-image", "server-tests"
# (develop also requires "agent-review", a commit status posted by t3-agent-review.yml)
#
# NOT "t3-ci / unit". For GitHub Actions the status-check context is the JOB name,
# not "<workflow> / <job>". Verified against the API:
#   gh api repos/tetracilin/test_ai_todo/commits/<sha>/check-runs --jq '.check_runs[].name'
# returns bare `unit`, `build`, `build-image`. A prefixed name matches no check, and
# branch protection then waits forever for a context that never reports — the same
# deadlock the deleted pr.yml's `verify`/`e2e` left on main.
#
# Docs-only pull requests skip `build` and `build-image` (see the `changes` job). They
# still report: a job skipped by its `if:` counts as passed for a required check, while a
# workflow-level `paths-ignore` would never report and the PR would wait forever. `unit`
# always runs, so the SSoT guards still gate every docs change.
#
# Hard fork of paperclipai/paperclip: upstream's pr.yml is gone. Its FAST code-behaviour
# jobs live here; its SLOW jobs (sharded vitest, e2e) moved to t3-nightly.yml.
# See PLAN_CICD.md §1.2 and technical-spec/fork/ORIGIN.md.

name: t3-ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: t3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request changes only documentation. Fails safe: pushes,
  # an empty diff, or any error in this job all mean "build everything", because
  # the downstream `if:` only skips on an explicit docs_only == 'true'.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # The PR merge commit and its first parent (the base branch tip).
          fetch-depth: 2
      - id: detect
        shell: bash
        run: |
          docs_only=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$files" ]; then
              docs_only=true
              while IFS= read -r f; do
                case "$f" in
                  # Markdown here can be runtime data (SKILL.md, TEAM.md, ...).
                  packages/*|server/*|cli/*|skills/*|ui/src/*) docs_only=false ;;
                  technical-spec/*|*.md) ;;
                  *) docs_only=false ;;
                esac
              done <<< "$files"
            fi
            echo "Changed files:"
            echo "$files"
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # Salvaged from pr.yml `policy` (fork guards only — the release-manifest and
  # lockfile-bot steps were deleted) plus the typecheck half of
  # pr.yml `typecheck_release_registry`.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Enforce SSoT guards
        run: node ./scripts/check-ssot-guards.mjs
      - name: Validate Dockerfile deps stage
        run: node ./scripts/check-docker-deps-stage.mjs
      - name: Reject git push in adapter/runtime code
        run: node ./scripts/check-no-git-push.mjs
      - name: Test no-git-push check
        run: node --test ./scripts/check-no-git-push.test.mjs
      - name: Enforce forbidden runtime gate
        run: pnpm check:no-google-runtime
      - name: Test forbidden runtime inventory
        run: pnpm test:check-no-google-runtime
      - name: Test client bundle scanner
        run: pnpm test:scan-client-bundle
      - name: Test general-server shard partition
        run: node --test ./scripts/__tests__/run-vitest-stable-shard.test.mjs
      - name: Test e2e shard partition
        run: node --test ./scripts/__tests__/e2e-shard.test.mjs
      - name: Test standalone package build concurrency
        run: node --test ./scripts/__tests__/build-standalone-concurrency.test.mjs
      - name: Test agent loop guard and state scripts
        # The guard decides whether an agent patch may be pushed
        # (technical-spec/specs/2026-10-12-agent-issue-loop-design.md section 5).
        # List the files: Node 22 does not accept a directory argument to --test.
        run: node --test ./scripts/__tests__/agent-patch.test.mjs ./scripts/__tests__/agent-guard.test.mjs ./scripts/__tests__/agent-state.test.mjs ./scripts/__tests__/agent-merge-policy.test.mjs ./scripts/__tests__/agent-review-render.test.mjs ./scripts/__tests__/agent-triage-policy.test.mjs ./scripts/__tests__/agent-release-policy.test.mjs ./scripts/__tests__/agent-breaker-policy.test.mjs
      - name: Lint the factory workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/t3-agent-review.yml .github/workflows/t3-agent-sweep.yml .github/workflows/t3-agent-triage.yml .github/workflows/t3-factory-breaker.yml
      - name: Test plugin-SDK dev symlinker
        # Salvaged from pr.yml's `pnpm run test:release-registry`, which was
        # otherwise release-only and is deleted with the rest of upstream's
        # release engineering. This one file is not a release test: it covers
        # scripts/link-plugin-dev-sdk.mjs, the root `postinstall` that every
        # build and test run depends on. vitest.config.ts declares no `scripts`
        # project, so nothing else in CI executes it.
        run: node --test ./scripts/link-plugin-dev-sdk.test.js
      - name: Typecheck workspaces whose build scripts skip TypeScript
        run: pnpm run typecheck:build-gaps

      # PLAN_CICD.md section 1.2 classifies code-behaviour tests as fast
      # (< 5 min -> this job) or slow (sharded server vitest, e2e ->
      # t3-nightly.yml). The fast half was never wired up: before this step the
      # job ran guard scripts and four `node --test` script tests, and no
      # vitest at all, so a pull request went green with every unit test in it
      # failing.
      #
      # These two groups are the non-server vitest projects. They need no
      # embedded Postgres, which is what makes the server suites slow and
      # contention-prone. `general-server` and the serialized suites stay in
      # t3-nightly.yml, exactly as section 1.2 specifies.
      - name: Unit tests (shared, db, adapters, plugin SDK)
        run: pnpm run test:run:general --group general-workspaces-b
      - name: Unit tests (ui, cli)
        run: pnpm run test:run:general --group general-workspaces-a

      # discord-bridge is not a pnpm workspace member (see pnpm-workspace.yaml)
      # and carries its own package-lock.json, so the vitest projects above
      # never reach it. It needs its own npm invocation.
      - name: Unit tests (discord-bridge)
        working-directory: discord-bridge
        run: npm ci && npm test

  # Salvaged wholesale from pr.yml `build`. The client-bundle scan and the
  # no-google network guard are security gates and must block a merge, so this
  # is a required check rather than nightly-only.
  build:
    name: build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Scan client bundle
        run: pnpm scan:client-bundle
      - name: Install Chromium for client network guard
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify client network guard
        run: pnpm test:e2e:no-google-network

  # The image build is the gate that actually matters for deploys.
  # Same build-args as the deploy workflows so CI exercises the same Dockerfile path.
  build-image:
    name: build-image
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
            PAPERCLIP_BUILD_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Server suites on pull requests that touch server-tested paths
  # (CICD/PLAN_AI_FACTORY.md decision D3, WP-FACTORY-001). Same shards and
  # commands as t3-nightly.yml, so a pull request and the nightly run agree.
  #
  # The job named `server-tests` is the required status check - use the EXACT
  # name. It passes when every shard passed, or when no server-tested path
  # changed. The shard jobs are not required checks themselves.
  server_changes:
    name: server-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # The PR merge commit and its first parent (the base branch tip).
          fetch-depth: 2
      - id: detect
        shell: bash
        run: |
          # Fails safe: a push, an empty diff, or any error here means "run".
          relevant=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qE '^(server/|packages/db/|packages/shared/|packages/adapters/|packages/adapter-utils/|packages/plugins/sdk/|packages/skills-catalog/|packages/teams-catalog/|pnpm-lock\.yaml$|vitest\.config\.ts$|scripts/run-vitest-stable\.mjs$|scripts/general-server-shard\.mjs$)'; then
              relevant=false
            fi
            echo "Changed files:"
            echo "$changed"
          fi
          echo "relevant=$relevant"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  server_tests_general:
    name: server-tests-shard (general-server ${{ matrix.shard }})
    needs: server_changes
    if: needs.server_changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: general-server shard ${{ matrix.shard }}/3
        run: pnpm run test:run:general --group general-server --shard-index ${{ matrix.shard }} --shard-count 3

  server_tests_serialized:
    name: server-tests-shard (serialized ${{ matrix.shard }})
    needs: server_changes
    if: needs.server_changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: serialized shard ${{ matrix.shard }}/2
        run: pnpm run test:run:serialized --shard-index ${{ matrix.shard }} --shard-count 2

  server_tests:
    name: server-tests
    needs: [server_changes, server_tests_general, server_tests_serialized]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on the shards
        env:
          CHANGES: ${{ needs.server_changes.result }}
          RELEVANT: ${{ needs.server_changes.outputs.relevant }}
          GENERAL: ${{ needs.server_tests_general.result }}
          SERIALIZED: ${{ needs.server_tests_serialized.result }}
        run: |
          echo "changes=$CHANGES relevant=$RELEVANT general=$GENERAL serialized=$SERIALIZED"
          if [ "$CHANGES" != "success" ]; then
            echo "server-changes did not finish; failing closed"
            exit 1
          fi
          if [ "$RELEVANT" != "true" ]; then
            echo "no server-tested path changed; nothing to run"
            exit 0
          fi
          [ "$GENERAL" = "success" ] && [ "$SERIALIZED" = "success" ]

