# t3-nightly — builds `develop`, deploys it to the t3-nightly stack on kmv8, then runs
# the server test suites and e2e against the deployed stack, sharded, then posts one
# summary. See CICD/PLAN_AI_FACTORY.md §0.2/Phase 1 for why this is shaped the way it is.
#
# Triggers: 22:00 UTC daily, or on demand (Run workflow). Optionally also on every
# push to develop — uncomment the `push:` block if you want continuous staging.
#
# `deploy` runs on the self-hosted runner (label: kmv8). Only `develop` is ever deployed
# there. Every test job runs on a GitHub-hosted runner and does not `needs: deploy` —
# see the e2e job's comment for why — so a skipped or failed deploy never silently skips
# the tests, and a test failure never blocks a healthy deploy from being recorded.

name: t3-nightly

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: develop)"
        required: false
        default: develop
  # push:
  #   branches: [develop]

permissions:
  contents: read

# Never run two nightly deploys at once; never cancel one mid-deploy.
concurrency:
  group: t3-deploy-nightly
  cancel-in-progress: false

env:
  COMPOSE_PROJECT: t3-nightly
  COMPOSE_FILE: deploy/compose.yaml
  IMAGE_NAME: paperclip
  HEALTH_URL: http://100.103.41.112:33130/api/health
  # PLAN_CICD.md §3 moves secrets here; until then point at /root/.hermes/secrets/t3-nightly.
  SECRETS_DIR: /etc/t3/secrets/nightly

jobs:
  deploy:
    name: build-and-deploy-nightly
    runs-on: [self-hosted, kmv8]
    # Every value another job (chiefly `summary`) needs after this job finishes,
    # so those jobs can report accurately without needing `environment: staging`
    # or the deploy secrets themselves. `tester_email` is computed in its own
    # always-run step below because the seed step it used to live next to is
    # skipped when the guard skips the deploy.
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      compare: ${{ steps.guard.outputs.compare }}
      last_sha: ${{ steps.guard.outputs.last }}
      head_sha: ${{ steps.guard.outputs.head }}
      changes: ${{ steps.guard.outputs.changes }}
      image: ${{ steps.tag.outputs.image }}
      drift: ${{ steps.drift.outputs.report }}
      tester_email: ${{ steps.report.outputs.tester_email }}
    environment:
      name: staging
      url: http://100.103.41.112:33130
    timeout-minutes: 30
    steps:
      - name: Skip scheduled run if develop has no new commits
        # Cheap guard: the last deployed sha is recorded in a marker file on the host.
        id: guard
        shell: bash
        env:
          # Read-only: only the compare endpoint below is called with it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.ref || 'develop' }}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.t3-deploy"
          last=$(cat "$HOME/.t3-deploy/nightly.sha" 2>/dev/null || echo none)
          head=$(git ls-remote --quiet "https://github.com/${{ github.repository }}.git" "refs/heads/$ref" | cut -f1)
          [[ -n "$head" ]] || { echo "ref $ref not found"; exit 1; }
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          # Change list for the summary: the first line of every commit landed
          # between the last deployed sha and this head (squash merges carry the
          # PR title and number). Two small API calls instead of a paged compare:
          # the compare gives the commit count, the commits endpoint gives the
          # newest 15 titles from head, so the newest changes are never lost
          # behind a page boundary. The shallow checkout below needs no history.
          # Best effort on purpose: a failed lookup yields an empty list and a
          # named status, never a failed deploy. `compare` is one of: ok,
          # same_commit, no_marker, lookup_failed.
          changes=""
          compare="lookup_failed"
          if [[ "$last" == none ]]; then
            compare="no_marker"
          elif [[ "$last" == "$head" ]]; then
            compare="same_commit"
          else
            api="${{ github.api_url }}/repos/${{ github.repository }}"
            auth=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json")
            if total=$(curl -fsS "${auth[@]}" "$api/compare/$last...$head?per_page=1" | jq -r '.total_commits') \
               && [[ "$total" =~ ^[0-9]+$ ]] \
               && changes=$(curl -fsS "${auth[@]}" "$api/commits?sha=$head&per_page=15" \
                    | jq -r --argjson total "$total" '
                        [.[:$total][] | .commit.message | split("\n")[0]
                         | select(test("^Merge (pull request|branch)") | not)]
                        | reverse
                        | (if $total > 15 then ["… \($total - 15) earlier commits"] + . else . end)
                        | .[] | "• " + .'); then
              compare="ok"
            else
              changes=""
            fi
          fi
          echo "compare=$compare" >> "$GITHUB_OUTPUT"
          { echo "changes<<EOF"; echo "$changes"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "schedule" && "$last" == "$head" ]]; then
            echo "no changes on $ref since last deploy ($last) — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve reporting values
        # Independent of the skip guard, so `summary` always has a tester email
        # to show even on a skipped or failed deploy.
        id: report
        shell: bash
        run: |
          echo "tester_email=${{ vars.STAGING_TESTER_EMAIL || 'admintest@staging.local' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip == 'false'
        with:
          ref: ${{ steps.guard.outputs.ref }}
          fetch-depth: 1
          clean: true   # runner workspace is disposable; never a shared checkout

      - name: Verify secrets present (fail early)
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          # The artifact keys are required by deploy/compose.yaml. Checking them
          # here turns a missing file into a named error instead of a bind-mount
          # failure several steps later.
          for f in postgres_password better_auth_secret \
                   paperclip_artifacts_access_key paperclip_artifacts_secret_key; do
            [[ -s "$SECRETS_DIR/$f" ]] || { echo "missing or empty $SECRETS_DIR/$f"; exit 1; }
          done

      - name: Compute image tag
        if: steps.guard.outputs.skip == 'false'
        id: tag
        shell: bash
        run: |
          short=$(git rev-parse --short=8 HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_NAME:nightly-$short" >> "$GITHUB_OUTPUT"

      - name: Build image
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -t "${{ steps.tag.outputs.image }}" \
            -f Dockerfile \
            --build-arg PAPERCLIP_BUILD_COMMIT="${{ steps.tag.outputs.full }}" \
            --build-arg PAPERCLIP_BUILD_VERSION="nightly-${{ steps.tag.outputs.short }}" \
            .

      - name: Deploy (compose up)
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          # ASSUMPTION A1 — these must match what deploy/compose.yaml reads.
          PAPERCLIP_IMAGE: ${{ steps.tag.outputs.image }}
          PAPERCLIP_PORT: ${{ vars.NIGHTLY_PORT || '33130' }}
          # Staging is reachable from the tailnet so a remote monitoring host can
          # poll it. It stays authenticated (deploy/compose.yaml sets
          # PAPERCLIP_DEPLOYMENT_MODE=authenticated), so this is tailnet-scoped
          # plus login-gated, the same posture as production.
          #
          # Binding the tailnet IP UNBINDS 127.0.0.1:33130 -- the ports entry in
          # deploy/compose.yaml publishes one address. HEALTH_URL above moves with
          # it; anything else pointing at loopback on this host must move too.
          PAPERCLIP_BIND_ADDRESS: 100.103.41.112
          # exposure=private + mode=authenticated enables the private-hostname
          # guard, which runs BEFORE the health route and 403s any Host: not in
          # this list. Both the tailnet IP and the MagicDNS name are listed, so a
          # browser can use either; loopback stays for anything still on the host.
          # See t3-release.yml for the same guard on production.
          PAPERCLIP_ALLOWED_HOSTNAMES: 100.103.41.112,hostinger-kvm8-host.tail9831b.ts.net,localhost,127.0.0.1
          # The only value that can put the PUBLISHED host port into Better
          # Auth's trusted origins. deriveAuthTrustedOrigins (server/src/auth/
          # better-auth.ts) expands PAPERCLIP_ALLOWED_HOSTNAMES using the
          # container's INTERNAL listen port (3100, per deploy/compose.yaml),
          # so it can only ever produce http://100.103.41.112:3100 -- never
          # :33130, which is what a browser actually sends. The remaining
          # source of trusted origins is config.auth.publicBaseUrl, which
          # deploy/scripts/container-entrypoint.sh writes from this variable
          # with baseUrlMode=explicit. Left unset, compose defaults it to
          # http://127.0.0.1:33100 (wrong host AND wrong port), so every
          # browser sign-in got 403 INVALID_ORIGIN. t3-release.yml sets the
          # prod equivalent; this is the fifth value that must move with a
          # bind change, not the fourth.
          PAPERCLIP_PUBLIC_URL: http://100.103.41.112:33130
          # Adapters an operator may pick when hiring an agent on this stack.
          # Set the `SELECTABLE_ADAPTER_TYPES` environment variable on the
          # `staging` GitHub Environment to override this default.
          PAPERCLIP_SELECTABLE_ADAPTER_TYPES: ${{ vars.SELECTABLE_ADAPTER_TYPES || 'hermes_gateway,claude_local' }}
          # deploy/compose.yaml's secrets: block reads these two *_FILE vars,
          # not SECRETS_DIR directly — without them it falls back to a
          # relative ./secrets/... path that doesn't exist on the runner.
          POSTGRES_PASSWORD_FILE: ${{ env.SECRETS_DIR }}/postgres_password
          BETTER_AUTH_SECRET_FILE: ${{ env.SECRETS_DIR }}/better_auth_secret
          PAPERCLIP_ARTIFACTS_ACCESS_KEY_FILE: ${{ env.SECRETS_DIR }}/paperclip_artifacts_access_key
          PAPERCLIP_ARTIFACTS_SECRET_KEY_FILE: ${{ env.SECRETS_DIR }}/paperclip_artifacts_secret_key
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" up -d --wait --wait-timeout 300

      - name: Health check (verifies deployed commit, not just HTTP 200)
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: deploy/scripts/healthcheck.sh "$HEALTH_URL" "${{ steps.tag.outputs.full }}" 30 5

      - name: Seed the persistent staging tester account
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          # Staging is login-gated, so QA needs a known account. Re-asserted on
          # every deploy rather than created by hand once, because a volume reset
          # would otherwise silently take the shared login away.
          #
          # The password lives in the `staging` GitHub Environment, never in the
          # repo -- it grants instance_admin on a live stack. The job already
          # declares `environment: staging` above, which is what makes this
          # secret resolvable here.
          SEED_TESTER_EMAIL: ${{ steps.report.outputs.tester_email }}
          SEED_TESTER_PASSWORD: ${{ secrets.STAGING_TESTER_PASSWORD }}
          SEED_TESTER_NAME: Staging Tester
        # HEALTH_URL minus /api/health: the seed must post from a trusted origin,
        # and PAPERCLIP_PUBLIC_URL above is what makes that host one.
        run: deploy/scripts/seed-staging-tester.sh "${HEALTH_URL%/api/health}" "$COMPOSE_PROJECT"

      - name: Post-deploy smoke check (authenticated request, not just health/sign-in)
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          # Same credentials the seed step just asserted. Read-only from here on.
          SEED_TESTER_EMAIL: ${{ steps.report.outputs.tester_email }}
          SEED_TESTER_PASSWORD: ${{ secrets.STAGING_TESTER_PASSWORD }}
        run: deploy/scripts/post-deploy-smoke.sh "${HEALTH_URL%/api/health}"

      - name: Record deployed sha
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: echo "${{ steps.tag.outputs.full }}" > "$HOME/.t3-deploy/nightly.sha"

      - name: Image retention (keep current + 1 rollback)
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: deploy/scripts/image-retention.sh "$IMAGE_NAME" nightly 2

      - name: Version drift report
        if: steps.guard.outputs.skip == 'false'
        id: drift
        shell: bash
        run: |
          out=$(deploy/scripts/version-drift.sh 2>&1 || true)
          { echo "report<<EOF"; echo "$out"; echo "EOF"; } >> "$GITHUB_OUTPUT"

  # Slow suites salvaged from upstream pr.yml (general_tests, verify_serialized_server,
  # e2e_shards). See PLAN_CICD.md §1.2.
  #
  # ASSUMPTION A6 CORRECTED (2026-09-02): the e2e suite does NOT accept an external base
  # URL. tests/e2e/playwright.config.ts declares a `webServer:` block that bootstraps a
  # throwaway instance on 127.0.0.1:$PORT and waits on its own /api/health. Pointing it at
  # the deployed :33130 stack is impossible, so per the plan's own fallback every test job
  # in this file runs independently of `deploy` — and therefore on a GitHub-hosted runner,
  # which keeps the suites off kmv8 and lets them run even when the deploy guard skips.
  #
  # Sharded across 2 GitHub-hosted runners via scripts/e2e-shard.mjs (already built and
  # unit-tested by t3-ci's "Test e2e shard partition" step, previously unused by any
  # workflow). One spec (smoke-lab) is ~40% of the lane's wall clock on its own
  # (scripts/e2e-shard.mjs's own comment), so sharding buys real parallelism even though
  # the unsharded lane already finishes in under 10 minutes.
  e2e:
    name: e2e (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || 'develop' }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The e2e webServer runs `paperclipai onboard --run`, which boots the real
      # server. That pulls in @paperclipai/plugin-sdk/testing the same way the
      # vitest suites do, so the prebuild is required here too -- without it the
      # bootstrap dies with ERR_MODULE_NOT_FOUND before Playwright sees a page.
      - name: Build plugin-SDK deps
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Install Chromium
        # Deliberately Playwright's bundled Chromium, NOT the runner's stable
        # Google Chrome. pr.yml and e2e.yml both pinned
        # PAPERCLIP_PLAYWRIGHT_CHANNEL=chrome; this fork drops that on purpose
        # (docs/migration/test-ai-todo-inventory.md: replace Google Chrome
        # invocation with vendor-neutral browser tooling; see also the
        # check:no-google-runtime gate in t3-ci). Bundled Chromium is also
        # version-pinned by the Playwright dependency, so nightly results do
        # not move when the runner image bumps Chrome.
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E shard ${{ matrix.shard }} (Playwright bootstraps its own instance)
        run: |
          set -euo pipefail
          specs="$(node scripts/e2e-shard.mjs --shard-index ${{ matrix.shard }} --shard-count 2)"
          echo "Running: $specs"
          pnpm exec playwright test --config tests/e2e/playwright.config.ts $specs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly-shard-${{ matrix.shard }}
          # test-results/ carries the failure screenshots and first-retry
          # traces (playwright.config.ts). Without it an unattended 22:00 UTC
          # failure arrives with nothing to triage from the next morning.
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  # server-tests + workspaces below replace the single "slow-tests" job (Full vitest
  # suite, general + serialized, one process). Sharded per CICD/PLAN_AI_FACTORY.md
  # Phase 1.2 to cut nightly wall clock and — more importantly — to stop many
  # concurrently-running server-suite files from starving each other's event loops
  # under CPU contention, which is what made a handful of timing-sensitive server
  # tests flake a different one each night (see PLAN_AI_FACTORY.md §0.2, and the
  # de-flaking already done for two of them in PR #108). general-server and
  # serialized are the two contention-sensitive groups; workspaces-a/b are fast,
  # non-server suites and stay unsharded.
  server_tests_general:
    name: server-tests (general-server, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || 'develop' }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # test:run:general already runs preflight:workspace-links and the
      # plugin-sdk prebuild -- no separate "ensure-build-deps" step needed here.
      - name: general-server shard ${{ matrix.shard }}/3
        run: pnpm run test:run:general --group general-server --shard-index ${{ matrix.shard }} --shard-count 3

  server_tests_serialized:
    name: server-tests (serialized, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || 'develop' }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: serialized shard ${{ matrix.shard }}/2
        run: pnpm run test:run:serialized --shard-index ${{ matrix.shard }} --shard-count 2

  workspaces_a:
    name: server-tests (workspaces-a — ui, cli)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || 'develop' }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:run:general --group general-workspaces-a

  workspaces_b:
    name: server-tests (workspaces-b — shared, db, adapters, plugin-sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || 'develop' }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:run:general --group general-workspaces-b

  # Single report for the whole run, replacing the three separate Discord steps
  # (deploy's, e2e's, slow-tests') this job's jobs used to carry independently.
  # `needs:` every job so `if: always()` still fires when one of them fails, but
  # this job itself never blocks anything -- it only reports.
  summary:
    name: nightly-summary
    needs: [deploy, e2e, server_tests_general, server_tests_serialized, workspaces_a, workspaces_b]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post one Discord report and job summary
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGING_URL: http://100.103.41.112:33130
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_SKIP: ${{ needs.deploy.outputs.skip }}
          DEPLOY_IMAGE: ${{ needs.deploy.outputs.image }}
          DEPLOY_COMPARE: ${{ needs.deploy.outputs.compare }}
          DEPLOY_LAST_SHA: ${{ needs.deploy.outputs.last_sha }}
          DEPLOY_HEAD_SHA: ${{ needs.deploy.outputs.head_sha }}
          DEPLOY_CHANGES: ${{ needs.deploy.outputs.changes }}
          DEPLOY_DRIFT: ${{ needs.deploy.outputs.drift }}
          TESTER_EMAIL: ${{ needs.deploy.outputs.tester_email }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SERVER_GENERAL_RESULT: ${{ needs.server_tests_general.result }}
          SERVER_SERIALIZED_RESULT: ${{ needs.server_tests_serialized.result }}
          WORKSPACES_A_RESULT: ${{ needs.workspaces_a.result }}
          WORKSPACES_B_RESULT: ${{ needs.workspaces_b.result }}
        run: |
          set -euo pipefail

          fmt_result() {
            case "$1" in
              success) echo "✅ success" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "🚫 cancelled" ;;
              *) echo "❌ $1" ;;
            esac
          }

          if [[ "$DEPLOY_SKIP" == "true" ]]; then
            deploy_line="deploy: ⏭️ skipped (no changes on develop since last deploy)"
          elif [[ "$DEPLOY_RESULT" == "success" ]]; then
            deploy_line="deploy: ✅ deployed ${DEPLOY_IMAGE:-develop} to staging"
          else
            deploy_line="deploy: $(fmt_result "$DEPLOY_RESULT") at ${DEPLOY_HEAD_SHA:0:8}"
          fi

          overall="success"
          for r in "$DEPLOY_RESULT" "$E2E_RESULT" "$SERVER_GENERAL_RESULT" "$SERVER_SERIALIZED_RESULT" "$WORKSPACES_A_RESULT" "$WORKSPACES_B_RESULT"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then overall="failure"; fi
          done
          top_emoji="✅"; [[ "$overall" == "failure" ]] && top_emoji="❌"

          # One sentence per compare state, so a reader diagnosing a run is never
          # told "redeployed" when the guard simply did not finish.
          case "$DEPLOY_COMPARE" in
            ok)
              if [[ -n "$DEPLOY_CHANGES" ]]; then
                changes="Changes since last deploy (${DEPLOY_LAST_SHA:0:8} → ${DEPLOY_HEAD_SHA:0:8}):"$'\n'"$DEPLOY_CHANGES"
              else
                changes="Changes since last deploy (${DEPLOY_LAST_SHA:0:8} → ${DEPLOY_HEAD_SHA:0:8}): merge commits only"
              fi ;;
            same_commit)   changes="Changes since last deploy: none, ${DEPLOY_HEAD_SHA:0:8} is already deployed" ;;
            no_marker)     changes="Changes since last deploy: unavailable, no previous deploy recorded on this runner" ;;
            lookup_failed) changes="Changes since last deploy: unavailable, GitHub compare lookup failed (see run log)" ;;
            *)             changes="Changes since last deploy: unavailable, guard step did not finish" ;;
          esac

          # Built with printf, not a heredoc: this whole step is itself a YAML
          # block scalar, and a heredoc's closing delimiter has to sit at
          # column 0 with no indentation, which a YAML-indented heredoc body
          # can't produce without `<<-` and literal tabs.
          body="$(printf 'e2e (2 shards): %s\nserver-tests general-server (3 shards): %s\nserver-tests serialized (2 shards): %s\nworkspaces-a: %s\nworkspaces-b: %s' \
            "$(fmt_result "$E2E_RESULT")" "$(fmt_result "$SERVER_GENERAL_RESULT")" "$(fmt_result "$SERVER_SERIALIZED_RESULT")" \
            "$(fmt_result "$WORKSPACES_A_RESULT")" "$(fmt_result "$WORKSPACES_B_RESULT")")"

          {
            echo "## t3-nightly summary"
            echo
            echo "$deploy_line"
            echo
            printf '%s\n' "$body" | sed 's/^/- /'
            echo
            echo "$changes"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "$WEBHOOK" ]]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord post"
            exit 0
          fi

          drift="${DEPLOY_DRIFT:-(no drift report)}"
          content=$(printf '%s nightly t3-nightly\nStaging: %s (login: %s)\nRun: <%s>\n%s\n%s\n%s\n```\n%s\n```' \
            "$top_emoji" "$STAGING_URL" "$TESTER_EMAIL" "$RUN_URL" "$deploy_line" "$body" "$changes" "${drift:0:500}")
          # Discord rejects messages over 2000 characters.
          if (( ${#content} > 1990 )); then content="${content:0:1980}"$'\n…'; fi
          # PR titles are contributor text: never let them ping @everyone,
          # @here, a user, or a role.
          jq -n --arg c "$content" '{content: $c, allowed_mentions: {parse: []}}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK" >/dev/null
