# CI — runs on every PR into develop or main, and on pushes to those branches.
# Runs on GitHub-hosted runners (never on kmv8): PR code is untrusted until merged.
# Required status checks for branch protection: "ci / lint-test" and "ci / build-image".

name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ASSUMPTION A4: pnpm/Node monorepo with lint/test scripts.
  # If the repo has no test suite, delete this job and the `needs:` line below.
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from package.json "packageManager" field; set explicitly if absent
        # with: { version: 9 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # The image build is the real gate: if the Dockerfile doesn't build, nothing deploys.
  # Uses the same build-args the deploy workflows use so CI exercises the same path.
  build-image:
    name: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
            PAPERCLIP_BUILD_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
