# t3-ci — merge gate. Runs on every PR into develop or main, and on pushes to them.
# GitHub-hosted runners only (never kmv8): PR code is untrusted until merged.
# Required status checks for branch protection: "t3-ci / build-image" and "t3-ci / unit".
#
# Hard fork of paperclipai/paperclip: upstream's pr.yml is gone. Its FAST code-behaviour
# jobs (typecheck / lint / unit) belong in the `unit` job below; its SLOW jobs (sharded
# vitest, e2e) belong in t3-nightly.yml. See PLAN_CICD.md §1.2.

name: t3-ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: t3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ASSUMPTION A4 — replace the three `run:` lines with the exact commands salvaged
  # from upstream pr.yml's fast jobs. Keep this job under ~5 minutes; anything slower
  # goes to t3-nightly. If the repo has no fast tests at all, delete this job and
  # remove "t3-ci / unit" from the required checks.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests (fast subset only)
        run: pnpm test:unit

  # The image build is the gate that actually matters for deploys.
  # Same build-args as the deploy workflows so CI exercises the same Dockerfile path.
  build-image:
    name: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
            PAPERCLIP_BUILD_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
