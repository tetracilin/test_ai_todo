# t3-nightly — builds `develop`, deploys it to the t3-nightly stack on kmv8, then runs
# the slow test suite (salvaged from upstream pr.yml) against the deployed stack.
# Replaces /root/.hermes/scripts/t3-nightly-build.sh + Hermes cron 8b51805f9dc5.
#
# Triggers: 22:00 UTC daily, or on demand (Run workflow). Optionally also on every
# push to develop — uncomment the `push:` block if you want continuous staging.
#
# Runs on the self-hosted runner (label: kmv8). Only `develop` is ever deployed here.

name: t3-nightly

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: develop)"
        required: false
        default: develop
  # push:
  #   branches: [develop]

permissions:
  contents: read

# Never run two nightly deploys at once; never cancel one mid-deploy.
concurrency:
  group: t3-deploy-nightly
  cancel-in-progress: false

env:
  COMPOSE_PROJECT: t3-nightly
  COMPOSE_FILE: deploy/compose.yaml
  IMAGE_NAME: paperclip
  HEALTH_URL: http://127.0.0.1:33130/api/health
  # PLAN_CICD.md §3 moves secrets here; until then point at /root/.hermes/secrets/t3-nightly.
  SECRETS_DIR: /etc/t3/secrets/nightly

jobs:
  deploy:
    name: build-and-deploy-nightly
    runs-on: [self-hosted, kmv8]
    outputs:
      skipped: ${{ steps.guard.outputs.skip }}
      sha: ${{ steps.out.outputs.sha }}
    environment:
      name: staging
      url: http://127.0.0.1:33130
    timeout-minutes: 30
    steps:
      - name: Skip scheduled run if develop has no new commits
        # Cheap guard: the last deployed sha is recorded in a marker file on the host.
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.ref || 'develop' }}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.t3-deploy"
          last=$(cat "$HOME/.t3-deploy/nightly.sha" 2>/dev/null || echo none)
          head=$(git ls-remote --quiet "https://github.com/${{ github.repository }}.git" "refs/heads/$ref" | cut -f1)
          [[ -n "$head" ]] || { echo "ref $ref not found"; exit 1; }
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "schedule" && "$last" == "$head" ]]; then
            echo "no changes on $ref since last deploy ($last) — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          ref: ${{ steps.guard.outputs.ref }}
          fetch-depth: 1
          clean: true   # runner workspace is disposable; never a shared checkout

      - name: Verify secrets present (fail early)
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          for f in postgres_password better_auth_secret; do
            [[ -s "$SECRETS_DIR/$f" ]] || { echo "missing or empty $SECRETS_DIR/$f"; exit 1; }
          done

      - name: Compute image tag
        if: steps.guard.outputs.skip == 'false'
        id: tag
        shell: bash
        run: |
          short=$(git rev-parse --short=8 HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_NAME:nightly-$short" >> "$GITHUB_OUTPUT"

      - name: Build image
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -t "${{ steps.tag.outputs.image }}" \
            -f Dockerfile \
            --build-arg PAPERCLIP_BUILD_COMMIT="${{ steps.tag.outputs.full }}" \
            --build-arg PAPERCLIP_BUILD_VERSION="nightly-${{ steps.tag.outputs.short }}" \
            .

      - name: Deploy (compose up)
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          # ASSUMPTION A1 — these must match what deploy/compose.yaml reads.
          PAPERCLIP_IMAGE: ${{ steps.tag.outputs.image }}
          NIGHTLY_PORT: ${{ vars.NIGHTLY_PORT || '33130' }}
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" up -d --wait --wait-timeout 300

      - name: Health check (verifies deployed commit, not just HTTP 200)
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: deploy/scripts/healthcheck.sh "$HEALTH_URL" "${{ steps.tag.outputs.full }}" 30 5

      - name: Record deployed sha
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: echo "${{ steps.tag.outputs.full }}" > "$HOME/.t3-deploy/nightly.sha"

      - name: Image retention (keep current + 1 rollback)
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: deploy/scripts/image-retention.sh "$IMAGE_NAME" nightly 2

      - name: Version drift report
        if: steps.guard.outputs.skip == 'false'
        id: drift
        shell: bash
        run: |
          out=$(deploy/scripts/version-drift.sh 2>&1 || true)
          { echo "report<<EOF"; echo "$out"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Expose outputs for the e2e job
        id: out
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: echo "sha=${{ steps.tag.outputs.full }}" >> "$GITHUB_OUTPUT"

      - name: Discord report
        if: always()
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [[ -n "$WEBHOOK" ]] || { echo "DISCORD_WEBHOOK_URL not set; skipping"; exit 0; }
          status="${{ job.status }}"
          if [[ "${{ steps.guard.outputs.skip }}" == "true" ]]; then
            emoji="⏭️"; line="nightly: no changes on develop, skipped"
          elif [[ "$status" == "success" ]]; then
            emoji="✅"; line="nightly: deployed ${{ steps.tag.outputs.image }} to :33130"
          else
            emoji="❌"; line="nightly: **$status** at ref ${{ steps.guard.outputs.head }}"
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          drift="${{ steps.drift.outputs.report }}"
          content=$(printf '%s %s\n<%s>\n```\n%s\n```' "$emoji" "$line" "$run_url" "${drift:-(no drift report)}")
          jq -n --arg c "$content" '{content: $c}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK" >/dev/null

  # Slow tests salvaged from upstream pr.yml (sharded vitest, e2e, browser).
  # Runs on kmv8 so it can reach the localhost-only nightly stack.
  # ASSUMPTION A6 — the e2e suite must accept a base URL via env. If it spins up its own
  # stack instead, move this job BEFORE deploy and drop the E2E_BASE_URL env.
  e2e:
    name: e2e-against-nightly
    needs: [deploy]
    if: needs.deploy.outputs.skipped == 'false'
    runs-on: [self-hosted, kmv8]
    timeout-minutes: 45
    env:
      E2E_BASE_URL: http://127.0.0.1:33130
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          fetch-depth: 1
          clean: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ASSUMPTION A4/A6 — replace with the exact commands from upstream pr.yml's slow jobs.
      - name: Full test suite
        run: pnpm test
      - name: E2E
        run: pnpm test:e2e
      - name: Discord report (e2e)
        if: failure()
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [[ -n "$WEBHOOK" ]] || exit 0
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg c "$(printf '⚠️ nightly e2e FAILED on develop @ %s\n<%s>' "${{ needs.deploy.outputs.sha }}" "$run_url")" '{content: $c}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK" >/dev/null
