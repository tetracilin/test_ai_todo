# Isolated Collabora CODE for Tasks staging. Browser traffic is exposed only by
# explicit Tailscale Serve rules; port 9981 remains loopback-only on the host.
name: t8578-office-staging

services:
  collabora:
    image: collabora/code:latest@sha256:6b70f91f0b6e9c76f75f162f58ef0a12cf9415d78e14713d33c0318ddc4a2cc0
    env_file:
      - ../secrets/office/collabora.env
    environment:
      domain: ${COLLABORA_WOPI_HOST_REGEX:-hostinger-kvm8-host\\.tail9831b\\.ts\\.net}
      aliasgroup1: ${COLLABORA_ALIASGROUP1:-https://hostinger-kvm8-host.tail9831b.ts.net:8447}
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:net.frame_ancestors=https://hostinger-kvm8-host.tail9831b.ts.net:8447
    ports:
      - "127.0.0.1:${COLLABORA_PORT:-9981}:9980"
    cap_add:
      - MKNOD
    restart: unless-stopped
    stop_grace_period: 30s
