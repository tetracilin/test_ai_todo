# K16 staging deployment — separate Compose project, volumes, DB, port and hostname.
# Never collides with the live host-network Paperclip (port 3100, embedded PG 54329)
# or the production deploy/ project. All runtime values come from deploy-staging/.env
# and deploy-staging/secrets/*; neither is committed.
name: ${COMPOSE_PROJECT_NAME:-t3-staging}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperclip}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - database

  paperclip:
    image: ${PAPERCLIP_IMAGE:-paperclip:k15-7927f06fa}
    entrypoint: ["/usr/local/bin/t3-container-entrypoint"]
    command: ["node", "--import", "./server/node_modules/tsx/dist/loader.mjs", "server/dist/index.js"]
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_CONFIG: /etc/paperclip/config.json
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_BIND: lan
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://127.0.0.1:33120}
      # Issue deep links sent to Discord use this external dashboard origin.
      PAPERCLIP_DASHBOARD_URL: ${PAPERCLIP_PUBLIC_URL:-http://127.0.0.1:33120}
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES:-localhost,127.0.0.1}
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      PAPERCLIP_MIGRATION_PROMPT: never
      PAPERCLIP_SECRETS_STRICT_MODE: "true"
      PAPERCLIP_TELEMETRY_DISABLED: "1"
      # Staging-only office editor bridge. Production stays disabled unless this
      # explicit environment gate is set on its own deployment.
      PAPERCLIP_WOPI_STAGING_ENABLED: ${PAPERCLIP_WOPI_STAGING_ENABLED:-false}
      PAPERCLIP_WOPI_EDITOR_ORIGIN: ${PAPERCLIP_WOPI_EDITOR_ORIGIN:-https://hostinger-kvm8-host.tail9831b.ts.net:8444}
      PAPERCLIP_WOPI_CALLBACK_ORIGIN: ${PAPERCLIP_WOPI_CALLBACK_ORIGIN:-}
      # Optional least-privilege MinIO source for artifact open-file flow.
      # Credentials resolve from Docker secrets by reference name, never env.
      PAPERCLIP_STORAGE_EXTERNAL_LABEL: ${PAPERCLIP_STORAGE_EXTERNAL_LABEL:-NAS MinIO}
      PAPERCLIP_STORAGE_EXTERNAL_ENDPOINT: ${PAPERCLIP_STORAGE_EXTERNAL_ENDPOINT:-}
      PAPERCLIP_STORAGE_EXTERNAL_REGION: ${PAPERCLIP_STORAGE_EXTERNAL_REGION:-us-east-1}
      PAPERCLIP_STORAGE_EXTERNAL_BUCKET: ${PAPERCLIP_STORAGE_EXTERNAL_BUCKET:-}
      PAPERCLIP_STORAGE_EXTERNAL_PREFIX: ${PAPERCLIP_STORAGE_EXTERNAL_PREFIX:-external/}
      PAPERCLIP_STORAGE_EXTERNAL_FORCE_PATH_STYLE: ${PAPERCLIP_STORAGE_EXTERNAL_FORCE_PATH_STYLE:-true}
      PAPERCLIP_STORAGE_EXTERNAL_ACCESS_KEY_SECRET_REF: ${PAPERCLIP_STORAGE_EXTERNAL_ACCESS_KEY_SECRET_REF:-paperclip_artifacts_access_key}
      PAPERCLIP_STORAGE_EXTERNAL_SECRET_KEY_SECRET_REF: ${PAPERCLIP_STORAGE_EXTERNAL_SECRET_KEY_SECRET_REF:-paperclip_artifacts_secret_key}
      PAPERCLIP_SECRETS_DIR: /run/secrets
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-paperclip}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      # Bridge-only bearer credential. The server accepts it only on
      # /api/integrations/discord/* and never exposes it to browsers.
      PAPERCLIP_DISCORD_BRIDGE_TOKEN_FILE: /run/secrets/paperclip_discord_bridge_token
      HERMES_API_BASE_URL: ${HERMES_API_BASE_URL:-http://host.docker.internal:8642}
    secrets:
      - postgres_password
      - better_auth_secret
      - paperclip_discord_bridge_token
      - paperclip_artifacts_access_key
      - paperclip_artifacts_secret_key
    volumes:
      - paperclip-data:/paperclip
      - ./paperclip-config.json:/etc/paperclip/config.json:ro
      - ./scripts/container-entrypoint.sh:/usr/local/bin/t3-container-entrypoint:ro
    ports:
      - "${PAPERCLIP_BIND_ADDRESS:-127.0.0.1}:${PAPERCLIP_PORT:-33120}:3100"
    extra_hosts:
      - "host.docker.internal:${HERMES_BRIDGE_IP:-172.20.0.1}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3100/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    networks:
      - database
      - gateway

  discord-bridge:
    image: ${PAPERCLIP_DISCORD_BRIDGE_IMAGE:-ghcr.io/paperclipai/paperclip-discord-bridge:canary}
    build:
      context: ../discord-bridge
    init: true
    environment:
      # The bridge is the Discord transport only; it talks to the staging
      # server's internal address. Every credential is a mounted secret,
      # never an inline value.
      PAPERCLIP_API_URL: http://paperclip:3100
      PAPERCLIP_API_KEY_FILE: /run/secrets/paperclip_discord_bridge_token
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
      DISCORD_CLIENT_ID_FILE: /run/secrets/discord_client_id
      DISCORD_WEBHOOK_SECRET_FILE: /run/secrets/discord_webhook_secret
      # Optional: restrict slash-command registration to one staging guild.
      # Unset (empty) means global command registration.
      DISCORD_DEV_GUILD_ID_FILE: ${DISCORD_DEV_GUILD_ID_FILE:-}
      POLL_INTERVAL_SECONDS: ${DISCORD_POLL_INTERVAL_SECONDS:-30}
      HEALTH_PORT: "8080"
    secrets:
      - paperclip_discord_bridge_token
      - discord_bot_token
      - discord_client_id
      - discord_webhook_secret
    healthcheck:
      # Loopback readiness endpoint; healthy only after the Discord gateway
      # connection is established (503 "starting" until then).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      paperclip:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - gateway

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  better_auth_secret:
    file: ${BETTER_AUTH_SECRET_FILE:-./secrets/better_auth_secret}
  # Discord bridge credentials. These are host-managed files ignored by git;
  # the bridge service consumes them through *_FILE paths, never inline env.
  discord_bot_token:
    file: ${DISCORD_BOT_TOKEN_FILE:-./secrets/discord_bot_token}
  discord_client_id:
    file: ${DISCORD_CLIENT_ID_FILE:-./secrets/discord_client_id}
  discord_webhook_secret:
    file: ${DISCORD_WEBHOOK_SECRET_FILE:-./secrets/discord_webhook_secret}
  paperclip_discord_bridge_token:
    file: ${PAPERCLIP_DISCORD_BRIDGE_TOKEN_FILE:-./secrets/paperclip_discord_bridge_token}
  paperclip_artifacts_access_key:
    file: ${PAPERCLIP_ARTIFACTS_ACCESS_KEY_FILE:-./secrets/paperclip_artifacts_access_key}
  paperclip_artifacts_secret_key:
    file: ${PAPERCLIP_ARTIFACTS_SECRET_KEY_FILE:-./secrets/paperclip_artifacts_secret_key}

volumes:
  postgres-data:
  paperclip-data:

networks:
  database:
    internal: true
  gateway:
    driver: bridge
    # Pin the subnet so the host-side gateway IP (x.x.0.1) is deterministic.
    # The Hermes relay binds to that IP and host.docker.internal resolves to it
    # (extra_hosts), keeping container->Hermes traffic on a single L2 bridge.
    ipam:
      config:
        - subnet: ${HERMES_BRIDGE_SUBNET:-172.20.0.0/24}
